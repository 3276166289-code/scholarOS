<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>scholarOS</title>
<script>
/* Build stamp in the title: the launcher uses it to tell which window belongs to this build (--app re-use is unreliable) */
document.title = "scholarOS · v" + (new URLSearchParams(location.search).get("v") || "dev");
/* Theme is pinned before the first frame: waiting for refreshState showed light-mode users a dark frame first (still a flash) */
document.documentElement.dataset.theme = localStorage.getItem("rw-theme") || "dark";
const savedZoom = localStorage.getItem("rw-ui-zoom");
if (savedZoom && !isNaN(parseFloat(savedZoom))) document.documentElement.style.zoom = savedZoom;
</script>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="content">
    <header class="topbar pywebview-drag-region" id="topbar"></header>
    <section id="globalTodo" class="global-todo" aria-label="Quick to-dos"></section>
    <div class="tabsbar" id="tabsbar"></div>
    <nav class="app-return" id="appReturn" aria-label="Back to the previous page" hidden>
      <button type="button" class="btn ghost" id="appReturnButton"><span aria-hidden="true">←</span><span id="appReturnLabel"></span></button>
    </nav>
    <div class="body"><main class="main" id="main" tabindex="-1" aria-label="Main content"></main></div>
    <footer class="statusbar" id="statusbar"></footer>
  </div>
</div>

<!-- Profile dialog (pinned fields only, nothing else stored) -->
<div id="profileModal" class="modal hidden">
  <div class="modal-mask"></div>
  <div class="modal-dialog" style="width:400px">
    <div class="modal-head"><h3>Profile</h3><button class="modal-close" id="btnProfClose">✕</button></div>
    <div class="modal-body">
      <label class="field"><span>Display name</span><input id="profName" class="tb-input" style="width:100%" placeholder="e.g. Alex Chen"></label>
      <label class="field"><span>Avatar Emoji</span><input id="profAvatar" class="tb-input" style="width:100%" placeholder="🎓" maxlength="4"></label>
      <label class="field"><span>Avatar photo (used first when set, the emoji stays as a fallback)</span>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input type="file" id="profPhotoFile" accept="image/*" style="display:none">
          <button type="button" class="btn ghost" id="btnProfPhotoPick">+ Upload photo</button>
          <button type="button" class="btn ghost" id="btnProfPhotoClear">Restore default (🎓)</button>
          <img id="profPhotoPrev" class="prof-photo-prev" alt="">
        </div></label>
      <label class="field"><span>Field of study</span><input id="profField" class="tb-input" style="width:100%" placeholder="e.g. Materials Science and Engineering"></label>
    </div>
    <div class="modal-foot">
      <button id="btnProfSave" class="btn btn-primary">Save</button>
      <button id="btnProfCancel" class="btn">Cancel</button>
    </div>
  </div>
</div>

<div id="zoteroModal" class="modal hidden">
  <div class="modal-mask"></div>
  <div class="modal-dialog modal-wide">
    <div class="modal-head"><h3>Add from Zotero</h3><button class="modal-close" id="btnZotClose">✕</button></div>
    <div class="modal-body">
      <p class="modal-desc" id="zotStatus">Connecting to the local Zotero library...</p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <select id="zotCollection" class="control" style="max-width:220px" title="Pick a Zotero collection"></select>
        <input id="zotQuery" class="control" placeholder="Search by title, author, or tag..." style="max-width:240px">
        <button class="btn ghost" id="zotSearch">Search</button>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;margin-left:4px">
          <input type="checkbox" id="zotSelectAll"> <span>Select this page</span>
        </label>
        <span style="flex:1"></span>
        <button class="btn btn-primary" id="zotToProject" disabled>Add the selected papers to the project</button>
        <span class="hint" id="zotCount"></span>
      </div>
      <div id="zotList" class="md-note-list" style="max-height:44vh;overflow:auto"></div>
    </div>
  </div>
</div>

<!-- Command palette (Ctrl+K) -->
<div id="cmdPaletteModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Search commands and pages">
  <div class="modal-mask" id="cmdPaletteMask"></div>
  <div class="modal-dialog cmd-palette-dialog">
    <div class="cmd-palette-head">
      <span class="cmd-palette-ico">⚡</span>
      <input id="cmdPaletteInput" class="cmd-palette-input" role="combobox" aria-label="Search commands and pages" aria-autocomplete="list" aria-controls="cmdPaletteResults" aria-expanded="false" placeholder="Search actions, pages, or projects..." autocomplete="off">
      <button type="button" class="modal-close" id="cmdPaletteClose" aria-label="Close the command palette">✕</button>
    </div>
    <div class="cmd-palette-body" id="cmdPaletteResults" role="listbox"></div>
    <div class="cmd-palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> to navigate</span>
      <span><kbd>Enter</kbd> Run</span>
      <span><kbd>Esc</kbd> to close</span>
      <button type="button" class="command-help-link" data-command="help">View all shortcuts</button>
    </div>
  </div>
</div>

<!-- Diff review studio -->
<div id="diffModal" class="modal hidden">
  <div class="modal-mask" id="diffModalMask"></div>
  <div class="modal-dialog modal-wide diff-dialog">
    <div class="modal-head">
      <h3><span id="diffModalTitle">Compare body changes and merge both ways</span></h3>
      <button class="modal-close" id="btnDiffClose">✕</button>
    </div>
    <div class="modal-body diff-modal-body">
      <div class="diff-stats" id="diffStats"></div>
      <div class="diff-split-view" id="diffContainer"></div>
    </div>
    <div class="modal-foot">
      <button id="btnDiffAccept" class="btn btn-primary">Accept all changes</button>
      <button id="btnDiffReject" class="btn ghost">Reject the suggestions, keep the original</button>
      <button id="btnDiffCancel" class="btn">Close</button>
    </div>
  </div>
</div>
