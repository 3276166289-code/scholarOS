[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-core"
version = "0.1.0"
description = "Offline paper computation for scholarOS: parse, cite, check"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "pypdf==6.16.2",
    "Pillow>=11,<14",
]

[project.scripts]
paper-core = "paper_core:main"

[tool.setuptools]
py-modules = ["paper_core"]
